name: Upload Python Package to PyPI when a Release is Created

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msad-query
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Asciidoctor
        run: sudo apt-get install asciidoctor
      - name: Convert README.asciidoc to README.rst
        run: asciidoctor -b docbook changes.asciidoc && pandoc -f docbook -t rst changes.xml -o changes.rst
        run: asciidoctor -b docbook license.asciidoc && pandoc -f docbook -t rst license.xml -o license.rst
        run: asciidoctor -b docbook readme.asciidoc && pandoc -f docbook -t rst readme.xml -o readme.rst
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: |
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1