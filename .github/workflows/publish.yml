name: Upload Python Package to PyPI when a Release is Created

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msad-query
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - name: Install Asciidoctor
        run: sudo apt-get install asciidoctor
      - name: Convert asciidoc(s) to rst(s)
        run: |
          asciidoctor changes.asciidoc -o changes.rst
          asciidoctor license.asciidoc -o license.rst
          asciidoctor readme.asciidoc -o readme.rst
      - name: Replace asciidoc references with rst
        run: |
          sed -i -e "s/.asciidoc/.rst/g" setup.py
          sed -i -e "s/.asciidoc/.rst/g" manifest.in
      - name: copy manifest to SOURCES
        run: cp manifest.in SOURCES.txt
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: |
          ls -lha
          python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1